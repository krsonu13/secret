databases:
  - name: birthday-postgres-db
    databaseName: birthday_db
    user: birthday_user
    plan: free
    region: oregon

services:
  # Option 1: Unified Full-Stack Web Service (Serves API + React Frontend together)
  - type: web
    name: birthday-sister-app
    env: node
    plan: free
    region: oregon
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: birthday-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: uploads
