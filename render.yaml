services:
  - type: web
    name: birthday-sister-app
    env: node
    plan: free
    region: oregon
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Paste your existing Render PostgreSQL URL or free Neon/Supabase DB URL
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: uploads
